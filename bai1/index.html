<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css" </head>

<body>
    <div class="overlay" id="overlay" onclick="hidePlaylist()"></div>
    <div class="container">

        <div class="music-player">
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle" onclick="togglePlaylist()">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>

            <h1 id="title">Song Title</h1>
            <p id="artist">Artist Name</p>
            <img src="media/audio.png" class="song-img" id="cover">

            <audio id="song"></audio>

            <div id="progress-container">
                <div id="progress"></div>
                <div id="circle"></div>
            </div>

            <!-- <input type="range" value="0" id="progress"> -->


            <div class="controls">
                <div onclick="previousSong()">
                    <i class="fa-solid fa-backward"></i>
                </div>
                <div onclick="playPause()">
                    <i class="fa-solid fa-play" id="ctrlIcon"></i>
                </div>
                <div onclick="nextSong()">
                    <i class="fa-solid fa-forward"></i>
                </div>
            </div>
            <div class="upload-container">
                <input type="file" id="upload" accept="audio/*" style="display: none;" onchange="uploadSong()">
                <button id="uploadBtn" onclick="document.getElementById('upload').click();">Upload Song</button>
            </div>
        </div>


    </div>

    <div class="playlist" id="playlist">
        <h2>Playlist</h2>

    </div>


</body>
<script src="main.js" type="text/javascript"></script>

</html>
